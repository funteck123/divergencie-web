:root{
  --navy:#1a3c5e;--gold:#e8a832;--sky:#4a9fd4;--coral:#e05a4e;
  --bg:#f4f4f4;--panel:#fff;--line:#e3e6ea;--ink:#161b22;--muted:#6b7280;
  --good:#1f9d55;--bad:#c0392b;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#e7e9ec;color:var(--ink);font:400 15px/1.5 Satoshi,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.frame{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.hidden{display:none!important}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding:calc(var(--safe-t) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.topbar h1{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0}
.circle{width:38px;height:38px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.circle svg{width:19px;height:19px;stroke:var(--navy);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:38px;height:38px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900;font-size:13px}

/* ---- resume banner ---- */
.resume{margin:16px 18px 0;background:var(--navy);color:#fff;padding:16px;display:flex;align-items:center;gap:14px}
.resume .txt{flex:1}
.resume .k{font:900 10px Satoshi;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 3px}
.resume .t{font-weight:900;font-size:15px;margin:0}
.resume .m{font-size:12px;color:rgba(255,255,255,.7);margin:2px 0 0}
.resume button{background:var(--gold);color:#1a1200;font-weight:900;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;white-space:nowrap}

/* ---- chips ---- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:16px 18px 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);padding:9px 16px;font:700 13px Satoshi;color:var(--ink);white-space:nowrap}
.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---- rows ---- */
section.sec{padding:14px 18px 22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.sec-h h2{font-size:14px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin:0}
.sec-h span{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.rows{background:var(--panel);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-height:44px}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.art{width:42px;height:42px;flex:none;background:var(--navy);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center}
.row.done .art{background:var(--good)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mid .t{display:block;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .m{display:block;font-size:12px;color:var(--muted)}
.chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.4;flex:none}

/* ---- mode screen ---- */
.mode-hero{padding:26px 18px 10px}
.mode-hero .k{font:900 11px Satoshi;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.mode-hero h1{font-size:28px;line-height:1.05;margin:0 0 6px}
.mode-hero p{color:var(--muted);font-size:13px;margin:0}
.mode-cards{padding:18px;display:flex;flex-direction:column;gap:12px}
.mode-card{background:var(--panel);border:1px solid var(--line);padding:20px;text-align:left}
.mode-card b{display:block;font-size:18px;font-weight:900;text-transform:uppercase;margin-bottom:4px}
.mode-card span{font-size:13px;color:var(--muted)}
.mode-card.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.mode-card.gold span{color:#4a3300}

/* ---- quiz screen ---- */
.quiz{min-height:100dvh;padding-bottom:calc(96px + var(--safe-b))}
.qtop{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.qtop .prog{flex:1;height:5px;background:var(--line);position:relative}
.qtop .prog i{position:absolute;inset:0;background:var(--navy);transform-origin:left;transition:transform .25s}
.qtop .cnt{font:900 12px Satoshi;color:var(--muted);white-space:nowrap}
.qbody{padding:20px 18px}
.qnum{font:900 11px Satoshi;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.flagbtn{display:flex;align-items:center;gap:6px;color:var(--muted)}
.flagbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.flagbtn.on{color:var(--coral)}
.flagbtn.on svg{fill:var(--coral);stroke:var(--coral)}
.stem{background:var(--panel);border:1px solid var(--line)}
.stem img{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:var(--panel);border:2px solid var(--line);padding:16px 10px;text-align:center;font-weight:900;font-size:17px;min-height:52px;display:grid;place-items:center}
.opt.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.correct{border-color:var(--good);background:var(--good);color:#fff}
.opt.incorrect{border-color:var(--bad);background:var(--bad);color:#fff}
.qactions{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:12px 14px calc(12px + var(--safe-b));display:flex;gap:10px}
@media(min-width:460px){.qactions{left:50%;right:auto;width:430px;transform:translateX(-50%)}}
.qactions button{flex:1;padding:15px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.btn-line{background:var(--panel);border:2px solid var(--navy);color:var(--navy)}
.btn-line[disabled]{opacity:.35;pointer-events:none}
.btn-gold{background:var(--gold);color:#1a1200}
.btn-navy{background:var(--navy);color:#fff}

/* ---- sheet + backdrop ---- */
.backdrop{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:80;opacity:0;pointer-events:none;transition:.18s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--panel);max-height:86dvh;overflow:auto;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:.22s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
@media(min-width:460px){.sheet{left:50%;right:auto;width:430px;transform:translate(-50%,105%)}.sheet.show{transform:translate(-50%,0)}}
.sheet .handle{width:36px;height:4px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-size:19px;margin:0 0 8px}
.sheet p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.sheet .row2{display:flex;gap:10px}
.sheet .row2 button{flex:1;padding:14px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}

/* ---- results ---- */
.results{min-height:100dvh;padding-bottom:calc(96px + var(--safe-b))}
.score-hero{background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 30px) 22px 30px;text-align:center}
.score-hero .k{font:900 11px Satoshi;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.score-hero .n{font-size:64px;font-weight:900;line-height:1;margin:0}
.score-hero .n small{font-size:26px;color:rgba(255,255,255,.6)}
.score-hero .r{font-size:13px;color:rgba(255,255,255,.75);margin-top:8px}
.review{padding:16px 18px}
.rrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);margin-bottom:6px;text-align:left;width:100%}
.rrow.ok{border-left-color:var(--good)}
.rrow.no{border-left-color:var(--bad)}
.rrow .qn{font-weight:900;font-size:13px;width:58px;flex:none}
.rrow .ans{flex:1;font-size:12.5px;color:var(--muted)}
.rrow .v{font:900 11px Satoshi;letter-spacing:.06em;text-transform:uppercase}
.rrow.ok .v{color:var(--good)}.rrow.no .v{color:var(--bad)}

/* ---- progress ---- */
.spark{width:100%;height:auto}
.spark text{font:700 9px Satoshi;fill:var(--muted)}
.trend-card{background:var(--panel);border:1px solid var(--line);padding:16px;margin:0 18px 18px}
.trend-card h3{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin:0 0 4px}
.trend-card p{font-size:12px;color:var(--muted);margin:0 0 10px}
.kpis{display:flex;gap:22px;padding:18px 18px 0}
.kpi b{display:block;font-size:26px;font-weight:900;color:var(--navy)}
.kpi span{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}

/* ---- bottom nav ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,1fr);padding:8px 8px calc(8px + var(--safe-b))}
@media(min-width:460px){.tabbar{left:50%;right:auto;width:430px;transform:translateX(-50%)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:800 10.5px Satoshi;text-transform:uppercase;letter-spacing:.04em;padding:6px 0;min-height:44px;justify-content:center}
.tab.active{color:var(--navy)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2}
.tab.active svg{stroke-width:2.4}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 16px;font-size:12.5px;font-weight:800;z-index:100;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.padnav{padding-bottom:calc(76px + var(--safe-b))}
</style>
</head>

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QUESTIONS=JSON.parse($("#qdata").textContent);
const PAPER_TITLES=JSON.parse($("#pdata").textContent);
const ICONS={back:'<path d="M15 18l-6-6 6-6"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`}

/* ---- state: real localStorage persistence, same mechanism as the fullunit
   reference (a single JSON blob, save() after every mutation). ---- */
const KEY="dc_solver_prototype_v1";
function seed(){
  return {
    attempts:[
      {id:1,paper:"Ch1.1 Length & Time Worksheet 1",subject:"Physics",score:9,total:12,when:"3 days ago",example:true},
      {id:2,paper:"Ch1.2 Motion Worksheet 1",subject:"Physics",score:11,total:15,when:"Yesterday",example:true},
    ],
    inProgress:null, // {answers:[], flags:[], startedAt}
    nextId:3,
  };
}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){data=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}

let route={screen:"library"};
let sheetOpen=false;

function go(screen,params={}){route={screen,...params};history.pushState(route,"",`#${screen}`);window.scrollTo(0,0);closeSheet();render()}
function back(){history.length>1?history.back():go("library")}
window.addEventListener("popstate",e=>{route=e.state||{screen:"library"};render()});

function openSheet(html){$("#sheet").innerHTML=html;$("#backdrop").classList.add("show");$("#sheet").classList.add("show");sheetOpen=true}
function closeSheet(){$("#backdrop").classList.remove("show");$("#sheet").classList.remove("show");sheetOpen=false}
let toastTimer;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1800)}

/* ---------- LIBRARY ---------- */
const SUBJECTS=["Physics","Chemistry","Biology","Mathematics"];
let selSubject="Physics";
function renderLibrary(){
  const ip=data.inProgress;
  const resume=ip?`<div class="resume"><div class="txt"><p class="k">In progress</p><p class="t">${esc(ip.paper)}</p><p class="m">Question ${ip.answers.filter(a=>a!=null).length} of ${ip.total} answered</p></div><button data-action="resume">Resume</button></div>`:"";
  const rows=PAPER_TITLES.map((t,i)=>{
    const hasReal=i===1; // only "Ch1.2 Motion Worksheet 1" has real question data loaded in this prototype
    const done=data.attempts.some(a=>a.paper===t&&!a.example);
    return `<button class="row${done?" done":""}" data-action="open-paper" data-title="${esc(t)}" data-real="${hasReal?1:0}">
      <span class="art">${esc(t.slice(0,2))}</span>
      <span class="mid"><span class="t">${esc(t)}</span><span class="m">Topical worksheet · MCQ${done?" · Completed":""}</span></span>
      ${icon("back",16).replace('stroke-width="2.2"','stroke-width="2.6"').replace('<path d="M15 18l-6-6 6-6"/>','<path d="M9 6l6 6-6 6"/>')}
    </button>`;
  }).join("");
  return `
    <header class="topbar"><h1>Library</h1><span class="avatar">A</span></header>
    ${resume}
    <div class="chiprow">${SUBJECTS.map(s=>`<button class="chip${s===selSubject?" sel":""}" data-action="subject" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <section class="sec padnav">
      <div class="sec-h"><h2>${esc(selSubject)} · MCQ</h2><span>${PAPER_TITLES.length} worksheets</span></div>
      <div class="rows">${rows}</div>
    </section>`;
}

/* ---------- MODE ---------- */
function renderMode(){
  const p=route.title;
  return `
    <header class="topbar"><button class="circle" data-action="back">${icon("back")}</button><span></span></header>
    <div class="mode-hero"><p class="k">${esc(p)}</p><h1>How do you<br>want to use it?</h1><p>15 real questions, real mark scheme.</p></div>
    <div class="mode-cards padnav">
      <button class="mode-card gold" data-action="start" data-mode="test"><b>Test</b><span>Timed. One submission. Real score at the end.</span></button>
      <button class="mode-card" data-action="start" data-mode="practice"><b>Practice</b><span>See the right answer after each question.</span></button>
    </div>`;
}

/* ---------- QUIZ ---------- */
function renderQuiz(){
  const r=route,q=QUESTIONS[r.i],n=QUESTIONS.length,ans=data.inProgress.answers[r.i],flagged=data.inProgress.flags[r.i];
  const opts="ABCD".split("").map(L=>`<button class="opt${ans===L?" sel":""}" data-action="answer" data-l="${L}">${L}</button>`).join("");
  const last=r.i===n-1,answeredCount=data.inProgress.answers.filter(a=>a!=null).length;
  return `
    <div class="quiz">
      <div class="qtop"><button class="circle" data-action="quit">${icon("close",16)}</button><div class="prog"><i style="transform:scaleX(${(r.i+1)/n})"></i></div><span class="cnt">${r.i+1}/${n}</span></div>
      <div class="qbody">
        <div class="qnum">Question ${q.n}<button class="flagbtn${flagged?" on":""}" data-action="flag">${icon("flag",15)}Flag</button></div>
        <div class="stem"><img src="${q.img}" alt="Question ${q.n}"></div>
        <div class="opts">${opts}</div>
      </div>
      <div class="qactions">
        <button class="btn-line" data-action="prev" ${r.i===0?"disabled":""}>Back</button>
        ${last?`<button class="btn-gold" data-action="review">Submit test</button>`:`<button class="btn-navy" data-action="next">Next</button>`}
      </div>
    </div>`;
}

/* ---------- RESULTS ---------- */
function renderResults(){
  const a=data.attempts.find(x=>x.id===route.id);
  const pct=Math.round(a.score/a.total*100);
  const rows=a.review.map(r=>`<button class="rrow ${r.ok?"ok":"no"}" data-action="view-q" data-i="${r.i}"><span class="qn">Q${r.n}</span><span class="ans">${r.ok?"Correct":`Your answer: ${r.you||"—"} · Correct: ${r.correct}`}</span><span class="v">${r.ok?"Correct":"Incorrect"}</span></button>`).join("");
  return `
    <div class="results">
      <div class="score-hero"><p class="k">${esc(a.paper)}</p><p class="n">${a.score}<small>/${a.total}</small></p><p class="r">${pct}% · Test mode</p></div>
      <div class="review">${rows}</div>
      <div class="padnav" style="padding:0 18px"><button class="btn-line" style="width:100%;padding:15px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:13px" data-action="nav" data-screen="library">Back to library</button></div>
    </div>`;
}

/* ---------- PROGRESS ---------- */
function sparkline(vals){
  const w=340,h=90,pad=14;
  const pts=vals.map((v,i)=>[pad+(i*(w-pad*2)/Math.max(vals.length-1,1)),h-pad-(v/100)*(h-pad*2)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#e8a832"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="#1a3c5e" stroke-width="2.5"/>${dots}<text x="${pad}" y="12">100%</text><text x="${pad}" y="${h-4}">0%</text></svg>`;
}
function renderProgress(){
  const real=data.attempts.filter(a=>!a.example);
  const all=data.attempts;
  const avg=all.length?Math.round(all.reduce((t,a)=>t+a.score/a.total,0)/all.length*100):0;
  return `
    <header class="topbar"><h1>Progress</h1><span class="avatar">A</span></header>
    <div class="kpis"><div class="kpi"><b>${all.length}</b><span>Attempts</span></div><div class="kpi"><b>${avg}%</b><span>Average</span></div></div>
    <div class="trend-card" style="margin-top:16px"><h3>Physics trend</h3><p>${real.length?"Includes your real attempt just now.":"Example data — take a real test to replace it."}</p>${sparkline(all.map(a=>Math.round(a.score/a.total*100)))}</div>
    <section class="sec padnav">
      <div class="sec-h"><h2>Attempt history</h2></div>
      <div class="rows">${all.slice().reverse().map(a=>`<div class="row"><span class="art">${Math.round(a.score/a.total*100)}%</span><span class="mid"><span class="t">${esc(a.paper)}${a.example?" · Example":""}</span><span class="m">${esc(a.subject)} · ${a.score}/${a.total} · ${esc(a.when)}</span></span></div>`).join("")||`<div class="empty">No attempts yet.</div>`}</div>
    </section>`;
}

/* ---------- router ---------- */
function render(){
  $("#tabbar").classList.toggle("hidden",["quiz","results"].includes(route.screen));
  const v=$("#view");
  if(route.screen==="library")v.innerHTML=renderLibrary();
  else if(route.screen==="mode")v.innerHTML=renderMode();
  else if(route.screen==="quiz")v.innerHTML=renderQuiz();
  else if(route.screen==="results")v.innerHTML=renderResults();
  else if(route.screen==="progress")v.innerHTML=renderProgress();
  else v.innerHTML=renderLibrary();
  $("#tabbar").querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.screen===route.screen));
}

/* ---------- actions (single delegated listener, same pattern as reference) ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(!el){ if(e.target===$("#backdrop"))closeSheet(); return }
  const a=el.dataset.action;
  if(a==="nav")go(el.dataset.screen);
  else if(a==="back")back();
  else if(a==="close-sheet")closeSheet();
  else if(a==="subject"){selSubject=el.dataset.s;render()}
  else if(a==="open-paper"){
    const title=el.dataset.title,real=el.dataset.real==="1";
    if(!real){toast("Not cached in this prototype — try Ch1.2 Motion Worksheet 1");return}
    go("mode",{title});
  }
  else if(a==="resume"){
    const ip=data.inProgress;go("quiz",{i:ip.answers.findIndex(x=>x==null)>=0?ip.answers.findIndex(x=>x==null):0,title:ip.paper});
  }
  else if(a==="start"){
    const mode=el.dataset.mode,title=route.title;
    data.inProgress={paper:title,answers:QUESTIONS.map(()=>null),flags:QUESTIONS.map(()=>false),total:QUESTIONS.length,mode};
    save();
    go("quiz",{i:0,title});
  }
  else if(a==="answer"){
    data.inProgress.answers[route.i]=el.dataset.l;save();render();
  }
  else if(a==="flag"){
    data.inProgress.flags[route.i]=!data.inProgress.flags[route.i];save();render();
  }
  else if(a==="next"){route.i++;render()}
  else if(a==="prev"){route.i--;render()}
  else if(a==="quit"){
    openSheet(`<div class="handle"></div><h3>Leave this test?</h3><p>Your progress will be saved. You can resume from the library.</p><div class="row2"><button class="btn-line" data-action="close-sheet">Keep going</button><button class="btn-navy" data-action="confirm-quit">Save &amp; exit</button></div>`);
  }
  else if(a==="confirm-quit"){closeSheet();go("library")}
  else if(a==="review"){
    const ip=data.inProgress,open=ip.answers.filter(x=>x==null).length;
    openSheet(`<div class="handle"></div><h3>Submit your test?</h3><p>${open?`${open} question${open>1?"s":""} unanswered. Unanswered questions score zero.`:"You've answered every question."}</p><div class="row2"><button class="btn-line" data-action="close-sheet">Keep going</button><button class="btn-gold" data-action="submit">Submit</button></div>`);
  }
  else if(a==="submit"){
    closeSheet();
    const ip=data.inProgress;
    let score=0;
    const rev=QUESTIONS.map((q,i)=>{const ok=ip.answers[i]===q.ans;if(ok)score++;return{i,n:q.n,ok,you:ip.answers[i],correct:q.ans}});
    const attempt={id:data.nextId++,paper:ip.paper,subject:"Physics",score,total:QUESTIONS.length,when:"Just now",review:rev,example:false};
    data.attempts.push(attempt);data.inProgress=null;save();
    go("results",{id:attempt.id});
  }
  else if(a==="view-q"){
    const i=+el.dataset.i,q=QUESTIONS[i];
    openSheet(`<div class="handle"></div><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Question ${q.n}</h3><button class="circle" data-action="close-sheet">${icon("close",16)}</button></div><img src="${q.img}" style="width:100%;border:1px solid var(--line);margin-top:10px">`);
  }
});

render();
</script>
</body>
</html>
