<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Claims — DivergenCIE</title>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="../../../css/shared.css" rel="stylesheet" />
  <link href="../../../css/portal.css" rel="stylesheet" />
  <script src="../../../js/theme.js"></script>
  <style>
    body { font-family: 'Satoshi', sans-serif; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.3rem; }
    .form-control { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); font-size: 0.9rem; }
    .submit-btn { display: inline-block; padding: 0.7rem 1.5rem; background: var(--gold); color: #fff; font-weight: 700; border-radius: 8px; cursor: pointer; border: none; }
    .submit-btn:hover { opacity: 0.9; }
    .nav-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .nav-tab { padding: 0.8rem 1rem; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); border-bottom: 2px solid transparent; }
    .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-subtle); font-size: 0.85rem; color: var(--text-primary); }
    th { font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }
  </style>
</head>
<body>
<div class="portal-layout">
  <aside class="portal-sidebar" id="sidebar">
    <div class="sidebar-head">
      <img src="../../../assets/images/logo.jpg" alt="DivergenCIE" class="sidebar-logo" />
      <div>
        <div class="sidebar-brand">Divergen<span>CIE</span></div>
        <div style="font-size:.65rem;color:var(--text-muted);font-weight:500">Staff Portal</div>
      </div>
    </div>
    <div class="sidebar-role">
      <div style="width:34px;height:34px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;color:#fff;flex-shrink:0">JS</div>
      <div>
        <div style="font-size:.82rem;font-weight:800;color:var(--text-primary)">Jamie Soh</div>
        <div class="role-badge role-staff">Staff</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="../dashboard.html" class="sidebar-nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="../tickets.html" class="sidebar-nav-item"><i data-lucide="inbox"></i> Tickets</a>
      <a href="../pr/attendance.html" class="sidebar-nav-item"><i data-lucide="calendar-check"></i> Attendance</a>
      <a href="claims.html" class="sidebar-nav-item active"><i data-lucide="receipt"></i> Claims</a>
      <a href="../shared/content-bank.html" class="sidebar-nav-item"><i data-lucide="folder-open"></i> Content Bank</a>
      <a href="../shared/meetings.html" class="sidebar-nav-item"><i data-lucide="users"></i> Meetings</a>
      <div style="margin-top:auto"></div>
      <a href="../../../auth/login.html" class="sidebar-nav-item" style="color:var(--coral)"><i data-lucide="log-out"></i> Sign Out</a>
    </nav>
  </aside>

  <main class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><i data-lucide="menu"></i></button>
      <div><div class="portal-page-title">Submit Payment Claim</div></div>
    </div>

    <div class="nav-tabs">
      <div class="nav-tab active" data-target="submit-tab">Submit Claim</div>
      <div class="nav-tab" data-target="history-tab">Claim History</div>
    </div>

    <div id="submit-tab" class="tab-content active">
      <div style="background:var(--bg-primary);border:1px solid var(--border);border-radius:14px;padding:1.5rem;max-width:600px">
        <form id="claim-form">
          <div class="form-group">
            <label class="form-label">Claim Month</label>
            <input type="month" id="claim-month" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Total Events Attended</label>
            <input type="text" id="claim-events" class="form-control" readonly style="background:var(--bg-secondary)">
          </div>
          <div class="form-group">
            <label class="form-label">Total Hours</label>
            <input type="text" id="claim-hours" class="form-control" readonly style="background:var(--bg-secondary)">
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea id="claim-notes" class="form-control" rows="3"></textarea>
          </div>
          <button type="submit" class="submit-btn">Submit Claim</button>
        </form>
      </div>
    </div>

    <div id="history-tab" class="tab-content">
      <div style="background:var(--bg-primary);border:1px solid var(--border);border-radius:14px;padding:1.5rem">
        <table id="history-table">
          <thead>
            <tr>
              <th>Month</th>
              <th>Events</th>
              <th>Hours</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../../js/portal.js"></script>
<script>
  lucide.createIcons();
  
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.nav-tab, .tab-content').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.target).classList.add('active');
      if(t.dataset.target === 'history-tab') renderHistory();
    });
  });

  const monthEl = document.getElementById('claim-month');
  const evntEl = document.getElementById('claim-events');
  const hrsEl = document.getElementById('claim-hours');

  monthEl.addEventListener('change', () => {
    let att = JSON.parse(localStorage.getItem('dc-staff-attendance') || '[]');
    let month = monthEl.value; // YYYY-MM
    let filtered = att.filter(a => a.date.startsWith(month));
    evntEl.value = filtered.length;
    let hrs = filtered.reduce((acc, curr) => acc + parseFloat(curr.duration||0), 0);
    hrsEl.value = hrs.toFixed(2);
  });

  document.getElementById('claim-form').addEventListener('submit', (e) => {
    e.preventDefault();
    let claims = JSON.parse(localStorage.getItem('dc-staff-claims') || '[]');
    claims.push({
      month: monthEl.value,
      events: evntEl.value,
      hours: hrsEl.value,
      status: 'Pending'
    });
    localStorage.setItem('dc-staff-claims', JSON.stringify(claims));
    alert('Claim submitted for management approval.');
    e.target.reset();
  });

  function renderHistory() {
    let tbody = document.querySelector('#history-table tbody');
    let claims = JSON.parse(localStorage.getItem('dc-staff-claims') || '[]');
    if(claims.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">No claims found.</td></tr>';
      return;
    }
    tbody.innerHTML = claims.reverse().map(c => `
      <tr>
        <td>${c.month}</td>
        <td>${c.events}</td>
        <td>${c.hours}</td>
        <td><span style="background:#fff3cd;color:#856404;padding:2px 6px;border-radius:4px;font-size:0.7rem;font-weight:bold">${c.status}</span></td>
      </tr>
    `).join('');
  }
  renderHistory();
</script>
</body>
</html>
