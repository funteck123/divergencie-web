<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Tickets — DivergenCIE</title>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="../../css/shared.css" rel="stylesheet" />
  <link href="../../css/portal.css" rel="stylesheet" />
  <script src="../../js/theme.js"></script>
  <style>
    body { font-family: 'Satoshi', sans-serif; }

    /* ── Ticket Grid Layout ── */
    .tickets-layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 992px) { .tickets-layout { grid-template-columns: 1fr; } }
    
    .list-panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; height: calc(100vh - 120px); position: sticky; top: 100px; overflow: hidden; }
    @media (max-width: 992px) { .list-panel { height: 500px; position: static; } }
    
    .detail-panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; display: none; }
    .detail-panel.active { display: block; }
    
    /* ── Filters & Headers ── */
    .panel-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); }
    .panel-title { font-size: .85rem; font-weight: 800; color: var(--text-primary); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: .5rem; }
    .panel-title svg { width: 16px; height: 16px; color: var(--gold); }
    
    .filter-bar { padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: .5rem; background: var(--bg-primary); }
    .filter-row { display: flex; gap: .5rem; }
    .filter-select { flex: 1; font-size: .75rem; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); outline: none; }
    
    /* ── Ticket List ── */
    .ticket-list { overflow-y: auto; flex: 1; padding: .5rem; }
    .ticket-card { padding: .85rem; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all .15s; border-bottom: 1px solid var(--border-subtle); display: flex; gap: .75rem; }
    .ticket-card:last-child { border-bottom: 1px solid transparent; }
    .ticket-card:hover { background: var(--bg-secondary); }
    .ticket-card.active { background: var(--bg-secondary); border: 1px solid var(--gold); }
    
    .priority-indicator { width: 4px; border-radius: 4px; flex-shrink: 0; }
    .p-urgent { background: #e53935; }
    .p-high { background: #ef6c00; }
    .p-medium { background: #f9a825; }
    .p-low { background: #43a047; }
    
    .tc-content { flex: 1; min-width: 0; }
    .tc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .2rem; }
    .tc-id { font-size: .65rem; font-weight: 800; color: var(--text-muted); }
    .tc-time { font-size: .65rem; color: var(--text-muted); }
    .tc-title { font-size: .8rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: .3rem; }
    
    /* ── Badges ── */
    .status-badge { font-size: .6rem; font-weight: 700; border-radius: 4px; padding: 2px 6px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .b-open { background: #fce4ec; color: #c62828; }
    .b-prog { background: #e3f2fd; color: #1565c0; }
    .b-pend { background: #fff3cd; color: #856404; }
    .b-res  { background: #e8f5e9; color: #2e7d32; }
    .b-clos { background: #f5f5f5; color: #616161; }
    html.dark .b-open { background: #2d0a13; color: #ef9a9a; }
    html.dark .b-prog { background: #162033; color: #90caf9; }
    html.dark .b-pend { background: #2a1f00; color: #ffc107; }
    html.dark .b-res  { background: #1b3d1f; color: #81c784; }
    html.dark .b-clos { background: #222; color: #999; }
  </style>
</head>
<body>
<div class="portal-layout">

  <!-- ── SIDEBAR ── -->
  <aside class="portal-sidebar" id="sidebar">
    <div class="sidebar-head">
      <img src="../../assets/images/logo.jpg" alt="DivergenCIE" class="sidebar-logo" />
      <div>
        <div class="sidebar-brand">Divergen<span>CIE</span></div>
        <div style="font-size:.65rem;color:var(--text-muted);font-weight:500">Staff Portal</div>
      </div>
    </div>

    <div class="sidebar-role">
      <div id="sidebar-avatar" style="width:34px;height:34px;border-radius:50%;background:#e8a832;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;color:#fff;flex-shrink:0">JS</div>
      <div>
        <div style="font-size:.82rem;font-weight:800;color:var(--text-primary)" id="sidebar-name">Jamie Soh</div>
        <div class="role-badge role-staff" id="sidebar-role-badge">Staff</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-nav-section">
        <div class="sidebar-nav-label">Main</div>
        <a href="dashboard.html" class="sidebar-nav-item">
          <svg data-lucide="layout-dashboard"></svg> Dashboard
        </a>
        <a href="tickets.html" class="sidebar-nav-item active">
          <svg data-lucide="inbox"></svg> Tickets
        </a>
        <a href="shared/content-bank.html" class="sidebar-nav-item">
          <svg data-lucide="folder-open"></svg> Content Bank
        </a>
        <a href="shared/meetings.html" class="sidebar-nav-item">
          <svg data-lucide="users"></svg> Meetings
        </a>
      </div>
      <div class="sidebar-nav-section" id="dept-nav-section" style="display:none">
        <div class="sidebar-nav-label" id="dept-nav-label">Dept Tools</div>
      </div>
      <div class="sidebar-nav-section">
        <div class="sidebar-nav-label">Help</div>
        <a href="https://wa.me/919650675507" target="_blank" class="sidebar-nav-item">
          <svg data-lucide="message-circle"></svg> WhatsApp DC
        </a>
        <a href="../../auth/login.html" class="sidebar-nav-item" style="color:var(--coral)">
          <svg data-lucide="log-out"></svg> Sign Out
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg data-lucide="sun" class="icon-sun" style="width:15px;height:15px"></svg>
        <svg data-lucide="moon" class="icon-moon" style="width:15px;height:15px"></svg>
        <span id="theme-label">Light Mode</span>
      </button>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="portal-main">

    <!-- Topbar -->
    <div class="portal-topbar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <svg data-lucide="menu" style="width:20px;height:20px"></svg>
      </button>
      <div>
        <div class="portal-page-title" id="page-title">Ticket Queue</div>
        <div class="portal-page-sub">Manage and resolve issues</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:.5rem">
        <button class="btn btn-primary" onclick="DC.portal.openModal('new-ticket-modal')">
          <svg data-lucide="plus" style="width:16px;height:16px"></svg> New Ticket
        </button>
      </div>
    </div>

    <!-- Dept context strip -->
    <div style="display:flex;align-items:center;gap:1rem;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:.75rem 1.25rem;margin-bottom:1.5rem">
      <div style="font-size:.75rem;font-weight:700;color:var(--text-muted)">VIEWING:</div>
      <select id="view-mode-switcher" style="font-size:.75rem;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);font-weight:600">
        <option value="member">My Assigned Tickets</option>
        <option value="supervisor">Full Dept Queue (Supervisor)</option>
      </select>
    </div>

    <div class="tickets-layout">
      <!-- List Panel -->
      <div class="list-panel">
        <div class="panel-header">
          <div class="panel-title"><svg data-lucide="list"></svg> Tickets (<span id="ticket-count">0</span>)</div>
        </div>
        <div class="filter-bar">
          <div class="filter-row">
            <select id="filter-status" class="filter-select">
              <option value="all">All Statuses</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="pending_reply">Pending Reply</option>
              <option value="resolved">Resolved</option>
            </select>
            <select id="filter-priority" class="filter-select">
              <option value="all">All Priorities</option>
              <option value="urgent">Urgent</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <div class="ticket-list" id="ticket-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Detail Panel -->
      <div class="detail-panel" id="detail-panel">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem">
          <div>
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem">
              <span id="dt-id" style="font-size:.7rem;font-weight:800;color:var(--text-muted)"></span>
              <span id="dt-badge" class="status-badge"></span>
              <div id="dt-priority" class="priority-indicator" style="height:12px;margin-left:4px"></div>
            </div>
            <h2 id="dt-title" style="font-size:1.2rem;font-weight:800;color:var(--text-primary);line-height:1.2">Select a ticket</h2>
          </div>
          <div style="text-align:right">
            <div id="dt-time" style="font-size:.7rem;color:var(--text-muted);margin-bottom:.2rem"></div>
            <div id="dt-author" style="font-size:.75rem;font-weight:700;color:var(--text-primary)"></div>
          </div>
        </div>
        
        <div id="dt-content" style="font-size:.85rem;color:var(--text-primary);line-height:1.5;margin-bottom:1.5rem;padding:1rem;background:var(--bg-secondary);border-radius:8px">
          <!-- Description -->
        </div>

        <!-- Controls (Status, Assign, Forward) -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:1rem;margin-bottom:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)">
          <div>
            <label style="display:block;font-size:.7rem;font-weight:700;color:var(--text-muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em">Update Status</label>
            <select id="dt-status" style="width:100%;font-size:.8rem;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary)">
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="pending_reply">Pending Reply</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div id="assign-wrapper" style="display:none">
            <label style="display:block;font-size:.7rem;font-weight:700;color:var(--text-muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em">Assign To</label>
            <select id="dt-assignee" style="width:100%;font-size:.8rem;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary)">
              <option value="unassigned">Unassigned</option>
              <option value="js">Jamie Soh</option>
              <option value="am">Alex M.</option>
              <option value="ts">Taylor S.</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:.7rem;font-weight:700;color:var(--text-muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em">Forward / Escalate</label>
            <select id="dt-forward" style="width:100%;font-size:.8rem;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary)">
              <option value="">-- Select action --</option>
              <option value="fwd-it">Forward to IT</option>
              <option value="fwd-hr">Forward to HR</option>
              <option value="esc-mgmt">Escalate to Management</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary" onclick="saveTicket()" style="width:100%;margin-bottom:2rem">
          <svg data-lucide="save" style="width:16px;height:16px"></svg> Save Changes
        </button>

        <!-- Comments -->
        <h3 style="font-size:.85rem;font-weight:800;color:var(--text-primary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem">
          <svg data-lucide="message-square" style="width:16px;height:16px;color:var(--gold)"></svg> Comments
        </h3>
        <div id="dt-comments" style="display:flex;flex-direction:column;gap:1rem;margin-bottom:1.5rem">
          <!-- Comments injected here -->
        </div>

        <div style="display:flex;gap:.5rem">
          <input type="text" id="dt-reply" placeholder="Type a reply..." style="flex:1;font-size:.8rem;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);outline:none" />
          <button class="btn btn-primary" onclick="addComment()">
            <svg data-lucide="send" style="width:16px;height:16px"></svg>
          </button>
        </div>

      </div>
    </div>
  </main>
</div>

<!-- ── MODAL: NEW TICKET ── -->
<div class="modal-overlay" id="new-ticket-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Create Ticket / Task</div>
      <button class="modal-close" onclick="DC.portal.closeModal('new-ticket-modal')">
        <svg data-lucide="x"></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" id="nt-title" class="form-control" placeholder="Brief summary of the issue..." />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div>
          <label class="form-label">Priority</label>
          <select id="nt-priority" class="form-control">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div>
          <label class="form-label">Target Dept</label>
          <select id="nt-dept" class="form-control">
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="PR" selected>PR / Operations</option>
            <option value="Marketing">Marketing</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="nt-desc" class="form-control" rows="4" placeholder="Provide details..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Link (Optional)</label>
        <input type="url" id="nt-link" class="form-control" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label class="form-label">File Upload (Optional)</label>
        <div style="border:1px dashed var(--border);border-radius:8px;padding:1rem;text-align:center;font-size:.75rem;color:var(--text-muted);cursor:pointer">
          <svg data-lucide="upload-cloud" style="width:20px;height:20px;margin:0 auto .5rem;color:var(--gold)"></svg>
          Click to upload or drag & drop files
        </div>
      </div>
    </div>
    <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:.5rem">
      <button class="btn btn-secondary" onclick="DC.portal.closeModal('new-ticket-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createNewTicket()">Create Ticket</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../js/portal.js"></script>
<script>
  // ── STATE ──
  let state = {
    dept: localStorage.getItem('dc-dept') || 'PR',
    role: 'supervisor', // 'supervisor' or 'member'
    viewMode: 'supervisor', // matches role initially
    filterStatus: 'all',
    filterPriority: 'all',
    activeTicketId: null
  };

  // Shared tickets in localStorage or mock data
  const STORAGE_KEY = 'dc-tickets';
  let tickets = [];

  function loadTickets() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      tickets = JSON.parse(stored);
    } else {
      // Seed initial mock data
      tickets = [
        { id: 'TK-011', dept: 'PR', author: 'Jamie Soh', assignee: 'js', status: 'open', priority: 'urgent', title: 'Schedule sync with new tutor', desc: 'Please confirm the schedule with David before end of day.', time: '2 hours ago', comments: [] },
        { id: 'TK-012', dept: 'PR', author: 'System', assignee: 'unassigned', status: 'pending_reply', priority: 'medium', title: 'Upload PR asset v2', desc: 'Design ready. Needs to be uploaded to Content Bank.', time: '1 day ago', comments: [] },
        { id: 'TK-013', dept: 'HR', author: 'Alex M.', assignee: 'am', status: 'in_progress', priority: 'high', title: 'Review candidates for Math position', desc: '3 CVs attached in HR folder.', time: '3 hours ago', comments: [] },
        { id: 'TK-014', dept: 'IT', author: 'Taylor S.', assignee: 'ts', status: 'resolved', priority: 'low', title: 'Reset password for teacher portal', desc: 'Done.', time: '2 days ago', comments: [] }
      ];
      saveToStorage();
    }
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
  }

  // ── RENDER LIST ──
  function renderList() {
    loadTickets();
    const listEl = document.getElementById('ticket-list');
    listEl.innerHTML = '';

    // Filter by View Mode (Role context)
    let filtered = tickets.filter(t => {
      if (state.viewMode === 'member') {
        // In member view, only see own assigned tickets
        return t.assignee === 'js'; // Mock current user ID
      } else {
        // Supervisor sees all for their dept
        return t.dept === state.dept;
      }
    });

    // Apply Status / Priority filters
    if (state.filterStatus !== 'all') {
      filtered = filtered.filter(t => t.status === state.filterStatus);
    }
    if (state.filterPriority !== 'all') {
      filtered = filtered.filter(t => t.priority === state.filterPriority);
    }

    document.getElementById('ticket-count').textContent = filtered.length;

    if (filtered.length === 0) {
      listEl.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-muted);font-size:.8rem">No tickets found.</div>';
      return;
    }

    filtered.forEach(t => {
      const isAct = state.activeTicketId === t.id ? 'active' : '';
      const badgeHtml = getBadgeHtml(t.status);
      
      const el = document.createElement('div');
      el.className = `ticket-card ${isAct}`;
      el.onclick = () => selectTicket(t.id);
      
      el.innerHTML = `
        <div class="priority-indicator p-${t.priority}"></div>
        <div class="tc-content">
          <div class="tc-head">
            <span class="tc-id">${t.id}</span>
            <span class="tc-time">${t.time}</span>
          </div>
          <div class="tc-title">${t.title}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.4rem">
            ${badgeHtml}
            ${t.assignee !== 'unassigned' ? `<span style="font-size:.65rem;color:var(--text-muted)">Assignee: ${t.assignee.toUpperCase()}</span>` : `<span style="font-size:.65rem;color:#e53935;font-weight:700">Unassigned</span>`}
          </div>
        </div>
      `;
      listEl.appendChild(el);
    });
  }

  function getBadgeHtml(status) {
    const map = {
      open: '<span class="status-badge b-open">Open</span>',
      in_progress: '<span class="status-badge b-prog">In Progress</span>',
      pending_reply: '<span class="status-badge b-pend">Pending Reply</span>',
      resolved: '<span class="status-badge b-res">Resolved</span>',
      closed: '<span class="status-badge b-clos">Closed</span>'
    };
    return map[status] || map.open;
  }

  // ── DETAIL PANEL ──
  function selectTicket(id) {
    state.activeTicketId = id;
    renderList(); // update active class
    
    const t = tickets.find(x => x.id === id);
    if (!t) return;
    
    document.getElementById('detail-panel').classList.add('active');
    document.getElementById('dt-id').textContent = t.id;
    document.getElementById('dt-badge').outerHTML = getBadgeHtml(t.status);
    document.getElementById('dt-badge').id = 'dt-badge'; // reapply id
    document.getElementById('dt-priority').className = `priority-indicator p-${t.priority}`;
    document.getElementById('dt-title').textContent = t.title;
    document.getElementById('dt-time').textContent = t.time;
    document.getElementById('dt-author').textContent = t.author;
    document.getElementById('dt-content').textContent = t.desc;
    
    // Set form controls
    document.getElementById('dt-status').value = t.status;
    document.getElementById('dt-assignee').value = t.assignee;
    document.getElementById('dt-forward').value = '';
    
    // Access control: only supervisor can assign
    const assignWrapper = document.getElementById('assign-wrapper');
    if (state.role === 'supervisor') {
      assignWrapper.style.display = 'block';
    } else {
      assignWrapper.style.display = 'none';
    }

    renderComments(t);
  }

  function renderComments(t) {
    const box = document.getElementById('dt-comments');
    box.innerHTML = '';
    if (t.comments.length === 0) {
      box.innerHTML = '<div style="font-size:.75rem;color:var(--text-muted);font-style:italic">No comments yet.</div>';
      return;
    }
    t.comments.forEach(c => {
      box.innerHTML += `
        <div style="background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;padding:.85rem">
          <div style="display:flex;justify-content:space-between;margin-bottom:.4rem">
            <span style="font-size:.75rem;font-weight:700;color:var(--text-primary)">${c.author}</span>
            <span style="font-size:.65rem;color:var(--text-muted)">${c.time}</span>
          </div>
          <div style="font-size:.8rem;color:var(--text-primary);line-height:1.4">${c.text}</div>
        </div>
      `;
    });
  }

  function addComment() {
    if (!state.activeTicketId) return;
    const input = document.getElementById('dt-reply');
    const text = input.value.trim();
    if (!text) return;

    const t = tickets.find(x => x.id === state.activeTicketId);
    if (t) {
      t.comments.push({
        author: 'Jamie Soh', // mock user
        text: text,
        time: 'Just now'
      });
      // Auto-update status if it was pending reply
      if (t.status === 'pending_reply') {
        t.status = 'in_progress';
      }
      saveToStorage();
      input.value = '';
      selectTicket(t.id); // re-render detail
    }
  }

  function saveTicket() {
    if (!state.activeTicketId) return;
    const t = tickets.find(x => x.id === state.activeTicketId);
    if (!t) return;

    t.status = document.getElementById('dt-status').value;
    
    if (state.role === 'supervisor') {
      t.assignee = document.getElementById('dt-assignee').value;
    }

    const fwd = document.getElementById('dt-forward').value;
    if (fwd === 'fwd-it') t.dept = 'IT';
    if (fwd === 'fwd-hr') t.dept = 'HR';
    
    saveToStorage();
    
    state.activeTicketId = null;
    document.getElementById('detail-panel').classList.remove('active');
    renderList();
  }

  // ── NEW TICKET ──
  function createNewTicket() {
    const title = document.getElementById('nt-title').value.trim();
    const desc = document.getElementById('nt-desc').value.trim();
    const priority = document.getElementById('nt-priority').value;
    const dept = document.getElementById('nt-dept').value;
    const link = document.getElementById('nt-link').value.trim();

    if (!title || !desc) {
      alert("Please enter title and description.");
      return;
    }

    const id = 'TK-' + String(Math.floor(Math.random() * 900 + 100)).padStart(3, '0');
    
    let fullDesc = desc;
    if (link) fullDesc += `\n\nLink: ${link}`;

    const t = {
      id: id,
      dept: dept,
      author: 'Jamie Soh',
      assignee: 'unassigned',
      status: 'open',
      priority: priority,
      title: title,
      desc: fullDesc,
      time: 'Just now',
      comments: []
    };

    tickets.unshift(t);
    saveToStorage();
    
    DC.portal.closeModal('new-ticket-modal');
    document.getElementById('nt-title').value = '';
    document.getElementById('nt-desc').value = '';
    document.getElementById('nt-link').value = '';

    renderList();
  }

  // ── INIT ──
  document.addEventListener('DOMContentLoaded', () => {
    // URL params override state
    const params = new URLSearchParams(window.location.search);
    if (params.has('dept')) state.dept = params.get('dept');
    
    // UI binding
    const viewSwitch = document.getElementById('view-mode-switcher');
    if (viewSwitch) {
      viewSwitch.value = state.viewMode;
      viewSwitch.addEventListener('change', (e) => {
        state.viewMode = e.target.value;
        state.role = e.target.value; // For demo, sync role with view mode
        // Reset detail panel
        state.activeTicketId = null;
        document.getElementById('detail-panel').classList.remove('active');
        renderList();
      });
    }

    const fStatus = document.getElementById('filter-status');
    const fPriority = document.getElementById('filter-priority');
    if (fStatus) fStatus.addEventListener('change', (e) => { state.filterStatus = e.target.value; renderList(); });
    if (fPriority) fPriority.addEventListener('change', (e) => { state.filterPriority = e.target.value; renderList(); });

    renderList();
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
