<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambassador Tickets — DivergenCIE</title>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="../../css/shared.css" rel="stylesheet" />
  <link href="../../css/portal.css" rel="stylesheet" />
  <script src="../../js/theme.js"></script>
  <style>
    body { font-family: 'Satoshi', sans-serif; }
    .card { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .form-control { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); font-size: 0.9rem; margin-bottom: 1rem; }
    .btn-gold { background: var(--gold); color: #fff; border-color: var(--gold); border-radius: 8px; padding: 0.6rem 1.2rem; cursor: pointer; font-weight: 700; border: none; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-subtle); font-size: 0.85rem; color: var(--text-primary); }
    th { font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }
    .status-badge { padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.7rem; }
    .nav-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .nav-tab { padding: 0.8rem 1rem; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); border-bottom: 2px solid transparent; }
    .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
<div class="portal-layout">
  <aside class="portal-sidebar" id="sidebar">
    <div class="sidebar-head">
      <img src="../../assets/images/logo.jpg" alt="DivergenCIE" class="sidebar-logo" />
      <div>
        <div class="sidebar-brand">Divergen<span>CIE</span></div>
        <div style="font-size:.65rem;color:var(--text-muted);font-weight:500">Ambassador Portal</div>
      </div>
    </div>
    <div class="sidebar-role">
      <div style="width:34px;height:34px;border-radius:50%;background:#e05a4e;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;color:#fff;flex-shrink:0">TM</div>
      <div>
        <div style="font-size:.82rem;font-weight:800;color:var(--text-primary)">Tariq Mahmood</div>
        <div class="role-badge" style="background:#fce4ec;color:#c62828;border-color:#f8bbd0">Ambassador</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="tickets.html" class="sidebar-nav-item active"><i data-lucide="inbox"></i> Support Tickets</a>
      <div style="margin-top:auto"></div>
      <a href="../../auth/login.html" class="sidebar-nav-item" style="color:var(--coral)"><i data-lucide="log-out"></i> Sign Out</a>
    </nav>
  </aside>

  <main class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><i data-lucide="menu"></i></button>
      <div><div class="portal-page-title">Support Tickets</div></div>
    </div>

    <div class="nav-tabs">
      <div class="nav-tab active" data-target="history-tab">My Tickets</div>
      <div class="nav-tab" data-target="new-tab">+ Raise Ticket</div>
    </div>

    <div id="history-tab" class="tab-content active">
      <div class="card">
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Subject</th>
                <th>Target Dept</th>
                <th>Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>TK-088</td>
                <td>Marketing Materials Request</td>
                <td>Marketing</td>
                <td>11 May</td>
                <td><span class="status-badge" style="background:#fff3cd;color:#856404">Open</span></td>
              </tr>
              <tr>
                <td>TK-082</td>
                <td>Commission Enquiry</td>
                <td>Finance</td>
                <td>02 May</td>
                <td><span class="status-badge" style="background:#e8f5e9;color:#2e7d32">Resolved</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="new-tab" class="tab-content">
      <div class="card" style="max-width:600px">
        <form id="ticket-form">
          <select class="form-control" required>
            <option value="">Select Target Department...</option>
            <option>PR / Ops</option>
            <option>Finance</option>
            <option>Marketing</option>
            <option>IT</option>
            <option>HR</option>
          </select>
          <input type="text" class="form-control" placeholder="Ticket Title" required>
          <select class="form-control">
            <option value="Low">Priority: Low</option>
            <option value="Medium">Priority: Medium</option>
            <option value="High">Priority: High</option>
          </select>
          <textarea class="form-control" rows="5" placeholder="Description..." required></textarea>
          <input type="file" class="form-control" style="background:transparent;border:none;padding-left:0">
          <button type="submit" class="btn-gold" style="width:100%">Submit Ticket</button>
        </form>
      </div>
    </div>

  </main>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../js/portal.js"></script>
<script>
  lucide.createIcons();
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.nav-tab, .tab-content').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.target).classList.add('active');
    });
  });
  document.getElementById('ticket-form').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Ticket submitted successfully. DC Staff will review shortly.');
    e.target.reset();
    document.querySelector('[data-target="history-tab"]').click();
  });
</script>
</body>
</html>
