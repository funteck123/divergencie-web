<style>
@font-face{font-family:Satoshi;src:url(/fonts/satoshi-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Satoshi;src:url(/fonts/satoshi-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Satoshi;src:url(/fonts/satoshi-700.woff2) format('woff2');font-weight:700;font-display:swap}

:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC05;--green:#34A853;--ink:#202124;--mut:#5f6368;--line:#dadce0;--bg:#f1f3f4;--acc:#1a3c5e;--pn:#fff;--hv:#f4f4f4;--on:#d5e8f0;--onb:#b4d3e2;--sh:0 1px 4px rgba(60,64,67,.25)}
body.dark{--ink:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--bg:#1e1f22;--pn:#2b2c2f;--hv:#3a3b3f;--on:#2d3e5c;--onb:#46618f;--acc:#8ab4f8;--sh:0 1px 4px rgba(0,0,0,.6)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Satoshi,Roboto,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
svg.ic.fx{transform:scaleX(-1)}svg.ic.r90{transform:rotate(90deg)}
#top{position:fixed;left:0;right:0;top:0;height:48px;background:var(--pn);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:30}
#top a{color:var(--acc);text-decoration:none;white-space:nowrap}
.logo{display:inline-flex;align-items:center;gap:8px;font:900 18px/1 Satoshi,Arial,sans-serif;letter-spacing:-.3px}.logo img{width:28px;height:28px;border-radius:6px;object-fit:cover}.logo b{color:#e8a832;font-weight:900}.logo small{font:700 11px/1 Satoshi,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-left:2px}body.dark .logo{color:#fff}
#name{flex:1;min-width:50px;border:1px solid transparent;border-radius:4px;padding:4px 8px;font:inherit;background:none;color:var(--ink);-webkit-user-select:text;user-select:text}
#name:hover,#name:focus{border-color:var(--line);background:var(--pn)}
#st{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.tb{display:flex;gap:6px;align-items:center;flex:none}
button,select,input[type=text],input[type=search],textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--pn);border-radius:4px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
button:hover{border-color:#bbb;background:var(--hv)}button.p{background:#e8a832;border-color:#e8a832;color:#1a1a1a;font-weight:700}button.p:hover{background:#d99a25;border-color:#d99a25}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--on);color:var(--acc);border-color:var(--onb)}
button:focus-visible,input:focus-visible,select:focus-visible,#cv:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select{background:var(--pn);border:1px solid var(--line);border-radius:4px;padding:3px 4px;max-width:120px}
#cv{position:fixed;left:0;top:48px;width:100vw;height:calc(100vh - 48px);touch-action:none;display:block;cursor:crosshair}
#ov{position:fixed;left:0;top:48px;width:100vw;height:calc(100vh - 48px);overflow:hidden;pointer-events:none;z-index:5}
.mo{position:absolute;transform-origin:50% 50%;background:#000;border-radius:6px;overflow:visible}
.mo video,.mo iframe,.mo audio{width:100%;height:100%;border:0;display:block;pointer-events:none;border-radius:6px;background:#000}
.mo.act video,.mo.act iframe,.mo.act audio{pointer-events:auto}
.mo.au{background:var(--pn);border:1px solid var(--line)}.mo.au audio{height:100%}
.mo .bar{position:absolute;left:0;right:0;top:-26px;height:24px;background:var(--pn);border:1px solid var(--line);border-radius:6px;display:none;align-items:center;gap:4px;padding:0 4px;pointer-events:auto;cursor:move;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}
.mo .hd{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid #1a73e8;display:none;pointer-events:none;transform:translate(-50%,-50%)}.mo.sel .hd{display:block}.mo.sel{outline:1.5px solid #1a73e8}.mo.sel .bar{display:flex}.mo .bar button{padding:0 6px;height:20px;font-size:12px}.mo .bar span{flex:1;overflow:hidden;text-overflow:ellipsis}
.pn{background:var(--pn);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh)}
#tools{position:fixed;left:12px;top:60px;padding:6px;display:flex;flex-direction:column;gap:3px;z-index:20;max-height:calc(100vh - 120px);overflow-y:auto;overflow-x:hidden}
#tools button,.fly button{width:38px;height:38px;padding:0;border-color:transparent;background:none;position:relative}
#tools button:hover,.fly button:hover{background:var(--hv)}#tools button.on,.fly button.on{background:var(--on);color:var(--acc);border-color:var(--onb)}
#tools button.g::after{content:"";position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-right-color:var(--mut);border-bottom-color:var(--mut)}
#tools hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
.fly{position:fixed;z-index:26;padding:6px;display:none;flex-wrap:wrap;gap:3px;max-width:230px}
.fly.open{display:flex}.fly button{width:40px;height:40px}
#props{position:fixed;left:64px;top:60px;padding:6px 10px;z-index:22;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 76px);overflow-x:auto;scrollbar-width:thin}
#props:empty{display:none}
#props .grp{display:flex;gap:4px;align-items:center;flex:none;padding-right:10px;border-right:1px solid var(--line)}#props .grp:last-child{border:0;padding:0}

#props label{color:var(--mut);font-size:12px;display:flex;gap:5px;align-items:center;white-space:nowrap}
#props input[type=range]{width:70px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--pn);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--acc)}input[type=color]{width:26px;height:26px;padding:0;border:0;background:none;cursor:pointer}
#zoom{position:fixed;right:12px;bottom:12px;display:flex;align-items:center;z-index:20}
#zoom button{border:0;background:none;width:34px;height:32px;padding:0}#zoom span{min-width:46px;text-align:center;color:var(--mut);font-size:12px}
#undo{position:fixed;left:12px;bottom:12px;display:flex;z-index:20}#undo button{border:0;background:none;width:38px;height:32px;padding:0}
#pages{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;z-index:20;max-width:46vw;overflow-x:auto}

#mm{position:fixed;right:12px;bottom:56px;width:168px;height:112px;z-index:19;display:none;cursor:pointer;overflow:hidden}
#mm canvas{width:100%;height:100%;display:block}
#side{position:fixed;left:0;top:48px;bottom:0;width:300px;background:var(--pn);border-right:1px solid var(--line);z-index:40;padding:12px;overflow:auto;transform:translateX(-100%);transition:transform .15s}
body.sb #side{transform:none}#side h3{margin:0 0 8px;font:500 15px Roboto,Arial}
.bd{border-left:4px solid var(--yellow);padding:6px 8px;margin:0 0 8px;background:var(--hv);border-radius:0 4px 4px 0;cursor:pointer;display:flex;gap:6px;align-items:center}
.bd.on{border-left-color:var(--blue);background:var(--on)}.bd .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bd small{color:var(--mut);display:block;font-size:11px}
.bd button{padding:2px 6px;border:0;background:none;color:var(--mut)}
#side .row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
#ed{position:fixed;z-index:35;display:none;min-width:40px;min-height:24px;border:2px solid var(--acc);border-radius:4px;background:rgba(255,255,255,.95);color:#202124;padding:2px 4px;outline:none;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;overflow:visible}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#202124;color:#fff;border-radius:6px;padding:6px 14px;font-size:13px;display:none;z-index:90;max-width:90vw;text-align:center}
.menu{position:fixed;z-index:60;padding:6px 0;display:none;min-width:210px;max-height:80vh;overflow:auto}

.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}.menu kbd,.cmd kbd{margin-left:auto;color:var(--mut);font:11px monospace;padding-left:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:8vh}
.modal.open{display:flex}.modal .box{background:var(--pn);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.35);width:min(680px,94vw);max-height:84vh;overflow:auto;padding:16px}

.modal input[type=text],.modal input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--pn);-webkit-user-select:text;user-select:text}
.cmd{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer}.cmd.on,.cmd:hover{background:var(--on)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.tpl .c{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:var(--pn)}.tpl .c:hover{border-color:var(--acc)}.tpl canvas{width:100%;height:110px;background:#fff;border-radius:4px;display:block}.tpl b{display:block;margin-top:4px}.tpl small{color:var(--mut)}
.hl2{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}.hl2 div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--line)}.hl2 kbd{font:12px monospace;color:var(--acc)}.hl2 h4{grid-column:1/-1;margin:10px 0 2px}
#find{position:fixed;right:12px;top:58px;z-index:45;padding:6px;display:none;align-items:center;gap:6px}#find.open{display:flex}#find input{width:180px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--pn)}
#pinfo{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;padding:6px 14px;display:none;color:var(--mut)}
body.pres #top,body.pres #tools,body.pres #props,body.pres #undo,body.pres #pages,body.pres #zoom,body.pres #mm{display:none!important}body.pres #cv,body.pres #ov{top:0;height:100vh}body.pres #pinfo{display:block}
#printImg{display:none}
#live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media(max-width:700px){#st,#top .logo,.tb .lb{display:none}#top{gap:4px;padding:0 6px}.tb{gap:3px}#pages{bottom:52px;max-width:70vw}#mm{bottom:100px}#props{left:60px;top:56px;max-width:calc(100vw - 68px)}.tb button{padding:5px 7px}#find{left:8px;right:8px}#find input{flex:1;width:auto}}
@media print{body>*:not(#printImg){display:none!important}#printImg{display:block!important;width:100%;max-height:100vh;object-fit:contain}html,body{overflow:visible}}

function thumb(tpl){const list=tpl.build(),sv=objs,svm=idMap,svx=cx;objs=list;rebuild();list.forEach(o=>{if(o.t==="text")fixText(o)});const k=document.createElement("canvas");k.width=360;k.height=220;const c=k.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,360,220);const b=unionBB(list),s=Math.min(330/(b[2]-b[0]||1),190/(b[3]-b[1]||1));c.setTransform(s,0,0,s,180-s*(b[0]+b[2])/2,110-s*(b[1]+b[3])/2);const sd=S.dark;S.dark=false;try{list.forEach(o=>drawObj(o,c))}catch(e){}S.dark=sd;objs=sv;idMap=svm;return k}

document.addEventListener("keydown",e=>{const tg=e.target,tn=tg&&tg.tagName,typing=tg&&(tn==="INPUT"||tn==="TEXTAREA"||tn==="SELECT"||tg.isContentEditable);
 if(editing)return;
 if($("modal").classList.contains("open")){if(e.key==="Escape")closeModal();return}
 if(pres){presentKey(e);return}
 if(typing)return;
 const k=combo(e);
 if(k===" "||e.key===" "){if(tn==="BUTTON"||tn==="A"||tn==="SELECT")return;space=true;cv.style.cursor="grab";e.preventDefault();return}
 if(/^(shift\+)?arrow(left|right|up|down)$/.test(k)&&sel.length&&tn!=="SELECT"){const s=e.shiftKey?10:S.gsnap?16:1,key=e.key;nudge(key==="ArrowLeft"?-s:key==="ArrowRight"?s:0,key==="ArrowUp"?-s:key==="ArrowDown"?s:0);e.preventDefault();return}
 if((k==="tab"||k==="shift+tab")&&document.activeElement===cv){if(cycleSel(e.shiftKey?-1:1))e.preventDefault();return}
 const c=KEYS[k];if(c){if(!c.pass)e.preventDefault();c.fn()}});

document.addEventListener("cut",e=>{if(editing||!sel.length||(e.target&&(e.target.tagName==="INPUT"||e.target.isContentEditable)))return;copySel();try{e.clipboardData.setData("application/x-dcwb","1");e.clipboardData.setData("text/plain",selObjs().map(textOf).filter(Boolean).join("\n"));e.preventDefault()}catch(x){}delSel()});
document.addEventListener("paste",e=>{if(editing||(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable)))return;const cd=e.clipboardData;if(!cd)return;e.preventDefault();
 const files=[].slice.call(cd.files||[]);if(files.length){addFiles(files);return}
 if(cd.getData("application/x-dcwb")){pasteClip();return}
 const t=cd.getData("text/plain");if(t&&t.trim()){const html=cd.getData("text/html");handleText(t);return}
 if(getClip())pasteClip()});
